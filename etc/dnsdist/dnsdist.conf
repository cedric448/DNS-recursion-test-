-- dnsdist 1.9.6 : 接入层 (UDP/TCP 53) -> unbound 127.0.0.1:5353
-- UDP listener 线程数 = addLocal 的 UDP 地址数量（每个线程独占一个 socket）
setLocal("0.0.0.0:53", {reusePort=true})
setMaxUDPOutstanding(65535)
setACL({"0.0.0.0/0","::/0"})   -- 生产请收紧到实际 VPC 网段

setTCPRecvTimeout(10)
setTCPSendTimeout(10)
setMaxTCPClientThreads(16)
setMaxTCPConnectionDuration(60)
setCacheCleaningDelay(10)

newServer({address="127.0.0.1:5353", name="unbound-1", sockets=8, order=1,
           checkInterval=1, maxCheckFailures=3, rise=1})

setServerPolicy(firstAvailable)
setVerboseHealthChecks(false)

controlSocket("127.0.0.1:5900")
setKey("dn5d1st-c0ntr0l-l0c4l")
