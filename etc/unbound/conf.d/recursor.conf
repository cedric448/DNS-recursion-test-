# 本机递归器：只给 dnsdist 用，监听 127.0.0.1:5353
server:
    interface: 127.0.0.1@5353
    do-ip6: no
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    # ---- 容量 / 并发 ----
    num-threads: 4
    so-reuseport: yes
    num-queries-per-thread: 8192
    outgoing-range: 16384
    outgoing-num-tcp: 256
    incoming-num-tcp: 1024
    edns-buffer-size: 1232
    msg-buffer-size: 65552
    msg-cache-size: 256m
    rrset-cache-size: 512m
    msg-cache-slabs: 8
    rrset-cache-slabs: 8
    infra-cache-slabs: 8
    key-cache-slabs: 8
    neg-cache-size: 64m
    infra-cache-min-rtt: 10
    infra-cache-numhosts: 500000
    infra-host-ttl: 900
    infra-cache-max-rtt: 3000
    infra-keep-probing: yes
    target-fetch-policy: "3 2 1 0 0"

    # 自定义根提示: 仅用实测最优的根 (详见 root.hints)
    root-hints: "/etc/unbound/root.hints"
    # 只用 hints 中的根，不做 NS 全集 priming（否则会把 13 台根全部拉回来）
    # 排除慢速/有丢包的根（scripts/probe-roots.py 的输出）
    do-not-query-address: 198.41.0.4/32
    do-not-query-address: 199.9.14.201/32
    do-not-query-address: 192.33.4.12/32
    do-not-query-address: 199.7.91.13/32
    do-not-query-address: 192.203.230.10/32
    do-not-query-address: 192.112.36.4/32
    do-not-query-address: 198.97.190.53/32
    do-not-query-address: 192.36.148.17/32
    do-not-query-address: 202.12.27.33/32
    key-cache-size: 64m
    jostle-timeout: 50
    delay-close: 0
    max-udp-size: 1232
    tcp-upstream: no

    # ---- 一致性 / 稳定性 ----
    prefetch: yes
    prefetch-key: yes
    cache-min-ttl: 60
    cache-max-ttl: 86400
    cache-max-negative-ttl: 900
    serve-expired: yes
    serve-expired-ttl: 14400
    serve-expired-reply-ttl: 30
    serve-expired-client-timeout: 1800
    rrset-roundrobin: no

    # ---- 递归行为 ----
    qname-minimisation: yes
    qname-minimisation-strict: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    aggressive-nsec: yes
    deny-any: yes
    minimal-responses: yes
    unwanted-reply-threshold: 10000000
    do-not-query-localhost: yes

    # ---- DNSSEC ----
    module-config: "validator iterator"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes
    val-permissive-mode: no
    root-key-sentinel: yes

    verbosity: 1
    logfile: ""
    log-queries: no
    statistics-interval: 0
    statistics-cumulative: yes
    extended-statistics: yes
    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: "/run/unbound/unbound.pid"
    do-daemonize: yes

remote-control:
    control-enable: yes
